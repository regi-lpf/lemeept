<div id="leme-painel-loader" data-widget-url="https://regi-lpf.github.io/lemeept/public/widget-elementor.html" style="padding:24px;border:1px solid #d9e1f2;border-radius:20px;background:#f8fafc;color:#111827;font-family:system-ui,-apple-system,sans-serif;font-size:14px;font-weight:700;">Carregando painel LEME / ProfEPT...</div>
<script>
(async function () {
    const host = document.getElementById("leme-painel-loader");
    if (!host || host.dataset.lemeLoading === "1") return;
    host.dataset.lemeLoading = "1";
    try {
        const res = await fetch(host.dataset.widgetUrl, { cache: "no-cache" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const wrapper = document.createElement("div");
        wrapper.innerHTML = (await res.text()).trim();
        const secao = wrapper.firstElementChild;
        if (!secao || secao.id !== "leme-painel-ept") throw new Error("Fragmento invalido.");
        host.replaceWith(secao);
        const scriptOriginal = secao.querySelector("script");
        if (scriptOriginal) {
            const novoScript = document.createElement("script");
            novoScript.textContent = scriptOriginal.textContent;
            scriptOriginal.replaceWith(novoScript);
        }
    } catch (err) {
        console.error("Falha ao carregar widget LEME / ProfEPT:", err);
        host.textContent = "O painel está temporariamente indisponível. Atualize a página para tentar novamente.";
    }
})();
</script>
