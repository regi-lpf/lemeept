name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar bundle do frontend
        run: python3 scripts/build_frontend.py --check

      - name: Montar artefato publico (_site)
        run: |
          mkdir -p _site/frontend _site/dist
          touch _site/.nojekyll
          cp index.html _site/index.html
          cp frontend/styles.css frontend/app.js _site/frontend/
          cp dist/painel-ept-v4.json dist/widget-elementor.html dist/loader-elementor.html _site/dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
