name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Frontend & Data Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sincronizar dependências com dev
        run: uv sync --frozen --no-install-project --group dev

      - name: Validar bundle Elementor e loader
        run: |
          uv run --no-sync python scripts/build_frontend.py --check --emit-loader
          uv run --no-sync python scripts/build_frontend.py --from-template --check --emit-loader

      - name: Validar contrato JSON v4 publicado
        run: |
          PYTHONPATH=src uv run --no-sync python -c "
          import json
          from pathlib import Path
          from lemeept_extractor.models import PainelEptV4Output
          dados = json.loads(Path('public/painel-ept-v4.json').read_text(encoding='utf-8'))
          out = PainelEptV4Output.model_validate(dados)
          print(f'Contrato OK: {out.total_defesas} defesas / {out.total_producoes} producoes')
          "

      - name: Executar suíte unitária
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest tests/test_lemeept.py -v

      - name: Instalar Chromium (Playwright)
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Executar smoke tests E2E do frontend
        env:
          LEMEEPT_REQUIRE_SMOKE: "1"
          PYTHONPATH: src
        run: uv run --no-sync python -m unittest tests/test_frontend_smoke.py -v

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Montar artefato publico (_site)
        run: |
          mkdir -p _site/frontend _site/public
          touch _site/.nojekyll
          cp index.html _site/index.html
          cp frontend/styles.css frontend/app.js _site/frontend/
          cp public/painel-ept-v4.json public/widget-elementor.html public/loader-elementor.html _site/public/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
